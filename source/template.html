<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a8f5a">
<meta name="description" content="DE Daily: learn data engineering with first-principles theory, fade recall, spaced repetition and real SQL. Works offline.">
<title>DE Daily · Learn Data Engineering</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a8f5a'/%3E%3Ctext x='32' y='43' font-size='30' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3EDE%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f4f6f5;--card:#fff;--ink:#14201b;--muted:#5d6b65;--line:#dfe5e2;--pri:#0a8f5a;--pri2:#067347;--ok:#0a8f5a;--okbg:#e3f5ec;--bad:#c0392b;--badbg:#fbe9e7;--meh:#b7791f;--mehbg:#fdf3e1;--easy:#2b6cb0;--code:#0f1a16;--codeink:#e6f2ec;--chip:#eef3f1;--r:14px}
@media (prefers-color-scheme:dark){:root{--bg:#0d1311;--card:#161f1b;--ink:#e7efeb;--muted:#9aaba3;--line:#26332d;--chip:#1f2b26;--okbg:#123326;--badbg:#3a1b17;--mehbg:#33280f;--code:#0a100d}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
#app{max-width:640px;margin:0 auto}
main{padding:12px 16px 24px}
h1{font-size:1.5rem;margin:0}h2{font-size:1.25rem;margin:.4em 0}h3{font-size:1.05rem;margin:.6em 0 .4em}
p{margin:.6em 0}code{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--chip);padding:1px 5px;border-radius:5px;font-size:.88em}
.muted{color:var(--muted)}.small{font-size:.86rem}.center{text-align:center}.right{text-align:right}.ok{color:var(--ok)}.bad{color:var(--bad)}
header.top{padding:18px 16px 6px}header.top .back{background:none;border:0;color:var(--pri);font-size:1rem;padding:6px 0;margin-bottom:4px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pill{background:var(--okbg);color:var(--ok);border-radius:99px;padding:3px 10px;font-size:.85rem;font-weight:600;white-space:nowrap}.pill.grey{background:var(--chip);color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:1.2rem}.stat span{font-size:.75rem;color:var(--muted)}
.bar{height:10px;background:var(--chip);border-radius:99px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--pri);border-radius:99px;transition:width .3s}
.bar.thin{height:5px;grid-column:1/-1;margin:2px 0 0}.bar.xp i{background:linear-gradient(90deg,#0a8f5a,#3cc48a)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-align:center;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.98)}.btn[disabled]{opacity:.45;cursor:default}
.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}.btn.primary:active{background:var(--pri2)}
.btn.big{width:100%;min-height:60px;font-size:1.12rem;margin:10px 0 6px}.btn.small{min-height:40px;font-size:.9rem;padding:6px 12px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--pri)}
.btn.good{border-color:var(--ok);color:var(--ok)}.btn.good.primary{color:#fff}.btn.bad{border-color:var(--bad);color:var(--bad)}.btn.meh{border-color:var(--meh);color:var(--meh)}.btn.easy{border-color:var(--easy);color:var(--easy)}
.actions{display:flex;flex-direction:column;gap:6px;margin:12px 0}.actions.two,.actions.three{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions.three{grid-template-columns:1fr 1fr 1fr}
.plan{padding-left:0;list-style:none;margin:8px 0}.plan li{padding:6px 0;border-bottom:1px dashed var(--line)}.plan li:last-child{border:0}
.week{display:flex;justify-content:space-between;padding:4px 6px}.day{text-align:center;font-size:.75rem;color:var(--muted)}.day i{display:block;width:26px;height:26px;border-radius:50%;background:var(--chip);margin:0 auto 2px;border:2px solid transparent}.day.on i{background:var(--pri)}.day.today i{border-color:var(--pri)}
.modrow{display:grid;grid-template-columns:1fr 90px 40px;align-items:center;gap:8px;font-size:.92rem;cursor:pointer}.modrow small{text-align:right;color:var(--muted)}
nav.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tab{flex:1;background:none;border:0;color:var(--muted);font:inherit;font-size:.72rem;padding:8px 0 10px;cursor:pointer;min-height:60px}.tab span{display:block;font-size:1.35rem;line-height:1.2}.tab.on{color:var(--pri);font-weight:700}
header.sess{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:10px;padding:10px 16px;z-index:4;border-bottom:1px solid var(--line)}
header.sess .bar{flex:1;margin:0}.x{background:none;border:0;font-size:1.4rem;color:var(--muted);min-width:44px;min-height:44px;cursor:pointer}.xpgain{font-weight:700;color:var(--ok);font-size:.9rem;min-width:40px;text-align:right}
main.step{padding-top:14px}
.kicker{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}.new{color:#fff;background:var(--meh);border-radius:6px;padding:0 6px;font-size:.72rem}
.ladder{display:flex;align-items:center;gap:4px;margin:8px 0;font-size:.85rem;color:var(--muted)}.ladder i{font-style:normal;width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--chip);font-size:.75rem;font-weight:700}.ladder i.done{background:var(--okbg);color:var(--ok)}.ladder i.cur{background:var(--pri);color:#fff}.ladder span{margin-left:6px}
h2.task{font-size:1.08rem;font-weight:600}
.def{font-size:1.08rem;line-height:1.9;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}.def.model{line-height:1.6}
pre.code{background:var(--code);color:var(--codeink);border-radius:12px;padding:14px;overflow-x:auto;font:14.5px/1.75 ui-monospace,Menlo,Consolas,monospace;white-space:pre;margin:10px 0}
.slot{display:inline-block;min-width:60px;border-bottom:2px solid var(--pri);background:var(--okbg);color:var(--ink);border-radius:6px 6px 0 0;padding:0 6px;cursor:pointer;line-height:1.5;white-space:pre}
pre .slot{background:#1f3a2e;color:#fff}.slot.filled{font-weight:600}.slot.ok{background:var(--okbg);color:var(--ok);border-color:var(--ok)}.slot.bad{background:var(--badbg);color:var(--bad);border-color:var(--bad)}.slot s{opacity:.7}
.gap{display:inline-block;background:var(--mehbg);color:var(--meh);border-radius:6px;padding:0 6px;font-weight:700}pre .gap{background:#3a2f12;color:#ffd58a}.gap.ok{background:var(--okbg);color:var(--ok)}.gap.bad{background:var(--badbg);color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.chip{min-height:46px;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--chip);color:var(--ink);font:600 .98rem ui-monospace,Menlo,Consolas,monospace;cursor:pointer}.chip.used{opacity:.3}.chips.static .chip{min-height:0;padding:4px 10px;font:500 .82rem system-ui,sans-serif;cursor:default}
.inputs{display:flex;flex-direction:column;gap:8px;margin:12px 0}.inp{display:flex;align-items:center;gap:8px}.inp span{min-width:28px;height:28px;border-radius:50%;background:var(--mehbg);color:var(--meh);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:.85rem}
input[type=text],textarea{width:100%;font:16px ui-monospace,Menlo,Consolas,monospace;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--pri)}.inp.ok input{border-color:var(--ok);background:var(--okbg)}.inp.bad input{border-color:var(--bad);background:var(--badbg)}
textarea{resize:vertical;font-family:system-ui,sans-serif;line-height:1.45}textarea.mono,.editor.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px}
.feedback{border-radius:12px;padding:12px 14px;margin:12px 0;font-weight:500}.feedback.good{background:var(--okbg);color:var(--ok)}.feedback.badfb{background:var(--badbg);color:var(--bad)}.feedback.meh{background:var(--mehbg);color:var(--meh)}
.label{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:14px 0 4px}
.why{background:var(--okbg);border-left:4px solid var(--pri);border-radius:10px;padding:10px 14px;margin:10px 0}.why .label{margin-top:0;color:var(--ok)}
.pro{background:var(--chip);border-radius:10px;padding:10px 14px;margin:12px 0;font-style:italic}.pro .label{font-style:normal;margin-top:0}
.think{border:1px dashed var(--line);border-radius:10px;padding:10px 14px;margin:12px 0}.think .label{margin-top:0}
details summary{cursor:pointer;padding:6px 0;color:var(--pri);font-weight:600}
.flash{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;min-height:170px;margin:12px 0}.flash h2{font-size:1.3rem}.flash hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}.grade{flex-direction:column;gap:0;min-height:64px;padding:6px}.grade small{font-weight:400;font-size:.72rem;opacity:.85}
.scenario{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}.scenario pre{background:var(--code);color:var(--codeink);padding:10px;border-radius:8px;overflow-x:auto;font-size:14px}
.schema{font-size:.88rem;margin:8px 0}.editor{margin-top:6px}
.hintbox{background:var(--mehbg);color:var(--ink);border-radius:10px;padding:10px 14px;margin:8px 0}.explain{background:var(--chip);border-radius:10px;padding:10px 14px}
.out{margin:8px 0}.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;margin:6px 0}table{border-collapse:collapse;font:13.5px ui-monospace,Menlo,Consolas,monospace;width:100%}th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{background:var(--chip)}td.null{color:var(--muted);font-style:italic}
.runbox{margin:8px 0}
.mod.soon{opacity:.75}.lessons{padding-left:0;list-style:none;margin:10px 0 0;counter-reset:l}.lessons li{counter-increment:l;display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;padding:10px 4px;border-top:1px solid var(--line);cursor:pointer;min-height:48px}.lessons li span::before{content:counter(l) ". ";color:var(--muted)}.lessons.soon li{cursor:default;color:var(--muted);display:block}.lessons li.next{background:var(--okbg);border-radius:8px}
.lv{font-size:.75rem;font-weight:700;color:var(--ok);background:var(--okbg);border-radius:6px;padding:1px 6px;white-space:nowrap}
.items{list-style:none;padding:0;margin:0}.items li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.92rem}.items li small,.items li>span:last-child{white-space:nowrap}
.lvl0{color:var(--muted);font-size:.8rem}.lvlN{color:var(--meh);font-weight:700;font-size:.8rem}.lvlM{color:var(--ok);font-weight:700;font-size:.8rem}
.seg{display:flex;gap:6px;margin:6px 0 10px}.seg button{flex:1;min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}.seg button.on{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:700}
.filebtn{position:relative}
.summary{text-align:center;padding-top:40px}.summary .plan{text-align:left;background:var(--card);border-radius:12px;padding:8px 14px;border:1px solid var(--line)}.big-emoji{font-size:3rem}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);background:#14201b;color:#fff;padding:10px 16px;border-radius:99px;font-size:.9rem;opacity:0;pointer-events:none;transition:all .2s;z-index:10}#toast.show{opacity:1;transform:translateX(-50%)}
.qlist{margin:4px 0 10px;padding-left:20px}.qlist li{margin:4px 0}
.mod.project{border:2px solid var(--pri)}.mod a{color:var(--pri)}
.srcf{text-transform:none;font-family:ui-monospace,Menlo,monospace;letter-spacing:0}

/* v3: bite-size terms, placement test, pacing */
.opts{display:flex;flex-direction:column;gap:8px;margin:12px 0}.opt{text-align:left;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:1rem;cursor:pointer;min-height:48px;-webkit-tap-highlight-color:transparent}.opt:active{border-color:var(--pri)}.opt.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:600}.opt.bad{border-color:var(--bad);background:var(--badbg);color:var(--bad)}.opt:disabled{cursor:default}
.pc{border-bottom:2px dotted var(--pri);padding-bottom:1px}.pc.later{opacity:.55;border-bottom-color:var(--line)}.pc.num::before{content:attr(data-n);display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--pri);color:#fff;font-size:.7rem;font-weight:700;margin-right:4px;vertical-align:2px}
.pips{display:flex;align-items:center;gap:5px;margin:8px 0 2px;font-size:.8rem;color:var(--muted)}.pips i{width:22px;height:8px;border-radius:99px;background:var(--chip)}.pips i.l1{background:var(--mehbg);box-shadow:inset 0 0 0 1px var(--meh)}.pips i.l2{background:var(--meh)}.pips i.l3{background:var(--pri)}.pips span{margin-left:6px}
table.mini{border-collapse:collapse;margin:8px 0;font-size:.9rem}table.mini td,table.mini th{border:1px solid var(--line);padding:3px 10px}table.mini .null{color:var(--muted);font-style:italic}
.pace{background:var(--mehbg);color:var(--meh);border-radius:10px;padding:6px 10px;margin:8px 0}.card.dim{opacity:.55}.card.welcome{border-color:var(--pri)}
</style>
</head>

<div id="toast" role="status"></div>
